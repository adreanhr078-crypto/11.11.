# 11.11 — Cloudflare Pages Configuration
# This file tells Cloudflare Pages how to build and deploy

name = "eleven-eleven"

# Build configuration
[build]
command = "npm run build"
output_dir = "dist"

# Cloudflare Pages Functions (for API routes)
[functions]
directory = "functions"

# The global progression API expects a private D1 binding named PLAYER_DB.
# Create/bind the database in Cloudflare, then apply migrations/ before deploy.
