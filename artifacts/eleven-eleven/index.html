<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>11.11 — رحلة الذاكرة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body { background: #070712; color: #E8E0D0; font-family: 'Cairo', system-ui, sans-serif; direction: rtl; }
    #root { min-height: 100vh; }
    .app-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #0F0F1E 0%, #070712 70%); color: #E8E0D0; gap: 14px; z-index: 1;
    }
    .app-loading h1 { margin: 0; font-size: 2.5rem; letter-spacing: 0.2em; animation: pulse 1.6s ease-in-out infinite; }
    .app-loading p { margin: 0; opacity: 0.6; font-size: 0.95rem; }
    @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="root">
    <div class="app-loading">
      <h1>11:11</h1>
      <p>جاري إيقاظ Echo...</p>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
